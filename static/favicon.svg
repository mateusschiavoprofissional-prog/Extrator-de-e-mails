<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing radar ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" stroke-opacity="0.25" />
  <!-- Inner glowing radar ring -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="url(#radarGrad)" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Radar sweep line -->
  <line x1="16" y1="16" x2="23" y2="9" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="23" cy="9" r="1" fill="#38bdf8" />
  
  <!-- Stylized modern envelope in center -->
  <rect x="11" y="12" width="10" height="8" rx="1.5" fill="url(#radarGrad)" />
  <path d="M11 13 L16 16.5 L21 13" fill="none" stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
</svg>
